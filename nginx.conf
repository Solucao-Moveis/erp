server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão para acelerar o carregamento
    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache longo só para imagens e fontes (mudam pouco)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # CSS/JS: sempre revalida com o servidor (304 via ETag) — assim todo
    # deploy de estilo/script entra fresco sem precisar de hard-refresh.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA: servir o manifesto com o tipo correto. Sem isto este Nginx manda como
    # application/octet-stream e o Chrome NÃO oferece "Instalar aplicativo".
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA-friendly: cai no index.html se a rota não existir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não cachear o HTML (sempre pega a versão nova)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
