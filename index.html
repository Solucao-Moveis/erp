<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMERP · Solução Móveis — Sistema de Gestão Empresarial</title>
  <meta name="description" content="SMERP — Hub central de sistemas da Solução Móveis. Acesso rápido a Compras, Produção e Logística." />
  <link rel="icon" type="image/png" href="assets/logo-solucao-moveis.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body class="smerp-booting">
  <!-- ===================== TELA DE CARREGAMENTO ===================== -->
  <div class="smerp-overlay smerp-loading" id="loadingOverlay">
    <div class="smerp-loading__box">
      <img class="smerp-loading__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
      <span class="smerp-loading__txt">Carregando<span class="smerp-dots" aria-hidden="true"></span></span>
    </div>
  </div>

  <!-- ===================== TELA DE LOGIN ===================== -->
  <div class="smerp-overlay smerp-login" id="loginOverlay" hidden>
    <form class="smerp-login__card" id="loginForm" autocomplete="on">
      <img class="smerp-login__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
      <h1 class="smerp-login__title">SMERP</h1>
      <p class="smerp-login__sub">Entre para acessar seus sistemas</p>

      <label class="smerp-field">
        <span>E-mail</span>
        <input id="loginEmail" name="email" type="email" required autocomplete="username" />
      </label>
      <label class="smerp-field">
        <span>Senha</span>
        <input id="loginPassword" name="password" type="password" required autocomplete="current-password" />
      </label>

      <p class="smerp-login__error" id="loginError" hidden></p>

      <button class="smerp-login__btn" id="loginSubmit" type="submit">Entrar</button>
      <button class="smerp-login__forgot" id="btnForgot" type="button">Esqueci minha senha</button>
    </form>
  </div>

  <!-- ===================== ATUALIZAÇÕES (página dedicada) ===================== -->
  <div class="smerp-overlay smerp-updates" id="updatesOverlay" hidden>
    <div class="smerp-modal__backdrop" data-close></div>
    <div class="upd" role="dialog" aria-modal="true" aria-labelledby="updTitle">
      <header class="upd__top">
        <div class="upd__brand">
          <img class="upd__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
          <div>
            <h2 class="upd__title" id="updTitle">Atualizações</h2>
            <p class="upd__sub">O que mudou em cada versão do SMERP</p>
          </div>
        </div>
        <button class="smerp-modal__close" id="updatesClose" type="button" aria-label="Fechar" data-close>&times;</button>
      </header>
      <div class="upd__body">
        <aside class="upd__filters" id="updFilters" aria-label="Filtrar por atualização"></aside>
        <div class="upd__detail" id="updDetail"></div>
      </div>
    </div>
  </div>

  <!-- ===================== APP SHELL (sidebar por sistema + principal por setor) ===================== -->
  <div class="app">
    <!-- SIDEBAR: atalhos por SISTEMA -->
    <aside class="side">
      <a class="side__brand" href="#" aria-label="SMERP — Início">
        <img src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
        <span class="side__brand-txt"><b>SMERP</b><span>Solução Móveis</span></span>
      </a>

      <div class="side__lbl">Geral</div>
      <button class="nav nav--home is-active" id="navInicio" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Início
      </button>
      <button class="nav nav--home" id="btnUpdates" type="button" title="Atualizações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/></svg>
        Atualizações
      </button>

      <div class="side__lbl">Sistemas</div>
      <nav class="side__sys" id="sideSystems" aria-label="Sistemas liberados"></nav>

      <div class="side__user">
        <div class="side__av" title="Solução Móveis" aria-hidden="true">SM</div>
        <div class="side__userinfo">
          <b>Solução Móveis</b>
          <small class="user-email" id="userEmail" hidden></small>
        </div>
        <button class="btn-logout" id="btnLogout" type="button" hidden>Sair</button>
      </div>
    </aside>

    <!-- PRINCIPAL: setores (clicar expande os sistemas pra escolher) -->
    <main class="main">
      <div class="main__top">
        <div>
          <div class="hello">Bem-vindo 👋</div>
          <h1 class="h1">Seu painel de gestão <span>· SMERP</span></h1>
          <p class="sub" id="introDesc">Escolha um setor e o sistema que quer usar.</p>
        </div>
        <span class="pill">v1.5</span>
      </div>

      <div class="secttl">Setores</div>
      <section class="tiles" id="systems" aria-label="Setores"></section>

      <div class="main__foot"><span>SMERP</span><i>·</i><span>Solução Móveis</span><i>·</i><span>v1.5</span></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=6"></script>
  <script src="notas.js?v=7"></script>
  <script src="script.js?v=8"></script>
</body>
</html>
