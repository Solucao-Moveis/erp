<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMERP · Solução Móveis — Sistema de Gestão Empresarial</title>
  <meta name="description" content="SMERP — Hub central de sistemas da Solução Móveis. Acesso rápido a Compras, Produção e Logística." />
  <link rel="icon" type="image/png" href="assets/logo-solucao-moveis.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body class="smerp-booting">
  <!-- ===================== TELA DE CARREGAMENTO ===================== -->
  <div class="smerp-overlay smerp-loading" id="loadingOverlay">
    <div class="smerp-loading__box">
      <img class="smerp-loading__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
      <span class="smerp-loading__txt">Carregando<span class="smerp-dots" aria-hidden="true"></span></span>
    </div>
  </div>

  <!-- ===================== TELA DE LOGIN ===================== -->
  <div class="smerp-overlay smerp-login" id="loginOverlay" hidden>
    <form class="smerp-login__card" id="loginForm" autocomplete="on">
      <img class="smerp-login__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
      <h1 class="smerp-login__title">SMERP</h1>
      <p class="smerp-login__sub">Entre para acessar seus sistemas</p>

      <label class="smerp-field">
        <span>E-mail</span>
        <input id="loginEmail" name="email" type="email" required autocomplete="username" />
      </label>
      <label class="smerp-field">
        <span>Senha</span>
        <input id="loginPassword" name="password" type="password" required autocomplete="current-password" />
      </label>

      <p class="smerp-login__error" id="loginError" hidden></p>

      <button class="smerp-login__btn" id="loginSubmit" type="submit">Entrar</button>
      <button class="smerp-login__forgot" id="btnForgot" type="button">Esqueci minha senha</button>
    </form>
  </div>

  <!-- ===================== HEADER ===================== -->
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="#" aria-label="SMERP — Página inicial">
        <img class="brand__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
        <span class="brand__divider" aria-hidden="true"></span>
        <span class="brand__text">
          <span class="brand__name">SMERP</span>
          <span class="brand__sub">Sistema de Gestão Empresarial</span>
        </span>
      </a>

      <div class="header__right">
        <span class="badge-version">v1.0</span>
        <span class="user-email" id="userEmail" hidden></span>
        <button class="btn-logout" id="btnLogout" type="button" hidden>Sair</button>
        <div class="avatar" title="Solução Móveis" aria-hidden="true">SM</div>
      </div>
    </div>
  </header>

  <!-- ===================== WORKSPACE ===================== -->
  <main class="workspace">
    <!-- Hub central -->
    <section class="hub" aria-label="SMERP">
      <div class="hub__ring" aria-hidden="true"></div>
      <div class="hub__core">
        <img class="hub__logo" src="assets/logo-solucao-moveis.png" alt="Solução Móveis" />
        <span class="hub__name">SMERP</span>
        <span class="hub__tag">Solução Móveis</span>
      </div>
    </section>

    <!-- Intro -->
    <div class="intro">
      <h1 class="intro__title">Bem-vindo ao seu painel de gestão</h1>
      <p class="intro__desc">Selecione um setor e o módulo que quer usar.</p>
    </div>

    <!-- Cards por setor (preenchidos pelo script.js conforme o acesso da pessoa) -->
    <section class="systems" id="systems" aria-label="Setores"></section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <span>SMERP</span><span class="footer__dot">·</span>
    <span>Solução Móveis</span><span class="footer__dot">·</span>
    <span>v1.0</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=4"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
